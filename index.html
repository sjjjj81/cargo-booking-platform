<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CARGO-BOOK // Logistics Platform</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Scattered pixel elements for diagonal dissolve texture -->
  <div class="px p1"></div>
  <div class="px p2"></div>
  <div class="px p3"></div>
  <div class="px p4"></div>
  <div class="px p5"></div>
  <div class="px p6"></div>
  <div class="px p7"></div>
  <div class="px p8"></div>

  <header class="bar">
    <h1>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="26" height="26" role="img" aria-label="Arcade Cabinet">
        <rect x="8" y="2" width="16" height="28" fill="white" stroke="black" stroke-width="1"/>
        <rect x="9" y="3" width="14" height="10" fill="white" stroke="black" stroke-width="1"/>
        <rect x="10" y="5" width="12" height="6" fill="white" stroke="black" stroke-width="1"/>
        <line x1="11" y1="7" x2="21" y2="7" stroke="black" stroke-width="1"/>
        <line x1="11" y1="9" x2="21" y2="9" stroke="black" stroke-width="1"/>
        <line x1="8" y1="14" x2="24" y2="14" stroke="black" stroke-width="1"/>
        <line x1="9" y1="14" x2="9" y2="16" stroke="black" stroke-width="1"/>
        <line x1="23" y1="14" x2="23" y2="16" stroke="black" stroke-width="1"/>
        <rect x="12" y="15" width="1" height="2" fill="black"/>
        <rect x="11" y="17" width="3" height="1" fill="black"/>
        <rect x="15" y="15" width="1" height="1" fill="black"/>
        <rect x="17" y="15" width="1" height="1" fill="black"/>
        <rect x="19" y="15" width="1" height="1" fill="black"/>
        <rect x="13" y="20" width="6" height="6" fill="white" stroke="black" stroke-width="1"/>
        <rect x="14" y="21" width="4" height="1" fill="black"/>
        <rect x="15" y="23" width="2" height="1" fill="black"/>
        <line x1="8" y1="18" x2="8" y2="28" stroke="black" stroke-width="1"/>
        <line x1="24" y1="18" x2="24" y2="28" stroke="black" stroke-width="1"/>
        <line x1="9" y1="27" x2="23" y2="27" stroke="black" stroke-width="1"/>
      </svg>
      CARGO-BOOK
    </h1>
    <nav>
      <button id="book" class="navbtn active" onclick="show('book')">BOOK CARGO</button>
      <button id="list" class="navbtn" onclick="show('list')">MY BOOKINGS</button>
    </nav>
  </header>

  <main class="wrap">
    <!-- BOOKING FORM -->
    <section id="book-view" class="card">
      <form id="cargoForm" onsubmit="submitBooking(event)">
        <fieldset class="grp"><legend>CUSTOMER</legend>
          <input id="name" required placeholder="Full name" />
          <input id="phone" required placeholder="Phone" />
          <input id="email" type="email" required placeholder="Email" />
        </fieldset>

        <fieldset class="grp"><legend>CARGO</legend>
          <input id="cargoName" required placeholder="Cargo name / type" />
          <textarea id="desc" rows="2" placeholder="Description (optional)"></textarea>
        </fieldset>

        <fieldset class="grp"><legend>DIMENSIONS (cm)</legend>
          <div class="row">
            <input id="L" type="number" min="0" step="0.1" required placeholder="Length" />
            <input id="W" type="number" min="0" step="0.1" required placeholder="Width" />
            <input id="H" type="number" min="0" step="0.1" required placeholder="Height" />
          </div>
        </fieldset>

        <fieldset class="grp"><legend>WEIGHT & DESTINATION</legend>
          <div class="row">
            <input id="weight" type="number" min="0" step="0.1" required placeholder="Weight (kg)" />
            <select id="service">
              <option value="Road">Road</option>
              <option value="Air">Air</option>
            </select>
          </div>
          <input id="pickup" required placeholder="Pickup address" />
          <input id="delivery" required placeholder="Delivery address" />
        </fieldset>

        <label class="check"><input id="insurance" type="checkbox" /> Insurance (+10)</label>

        <div class="quote" id="quote">
          <div>CHARGEABLE WEIGHT: <b id="qW">0.00</b> kg</div>
          <div>RATE: <b id="qR">2.00</b> /kg + flat <b id="qF">50</b></div>
          <div>INSURANCE: <b id="qI">0</b></div>
          <div class="tot">TOTAL: <b id="qT">0.00</b></div>
        </div>

        <button type="submit" class="big">► BOOK NOW</button>
        <p id="msg" class="msg"></p>
      </form>
    </section>

    <!-- BOOKINGS DASHBOARD -->
    <section id="list-view" class="card hidden">
      <div class="listhead">
        <h2>SHIPMENT REGISTRY</h2>
        <button class="small" onclick="clearAll()">CLEAR ALL</button>
      </div>
      <div id="bookings"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
